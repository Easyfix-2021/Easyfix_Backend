openapi: 3.0.3

# ─────────────────────────────────────────────────────────────────────
# STATIC SCAFFOLDING ONLY.
#
# The `paths:` section is intentionally absent — every endpoint in the
# live Express app is auto-discovered at runtime by
# `docs/openapi-autogen.js` (introspects `app._router.stack` + the
# `_openapi` metadata tags on `validate()` and auth middlewares).
#
# This file contains only the bits the autogen cannot derive:
#   - info       — human title + description + version
#   - servers    — runtime base URLs
#   - tags       — group descriptions for Swagger UI
#   - components.securitySchemes — auth scheme definitions referenced
#       by the autogen via the `_openapi.security` tag on each
#       auth middleware
#   - components.schemas — reusable response shapes that handlers
#       reference indirectly (e.g. the Job / Notice shapes consumers
#       look up by `$ref`). Hand-curated because Joi doesn't describe
#       response shapes.
# ─────────────────────────────────────────────────────────────────────

info:
  title: EasyFix Backend API
  description: |
    Unified backend serving three frontends + external integrations:

    | Tier | Mount | Auth | Consumer |
    |---|---|---|---|
    | **Admin (CRM)** | `/api/admin/*` | Bearer JWT (CRM user) | Easyfix_CRM_UI |
    | **Mobile (Technician)** | `/api/mobile/*` | Bearer JWT (tech) | Easyfix_Technician_Mobile_Application |
    | **Client (SPOC)** | `/api/client/*` | Bearer JWT (client SPOC) | Easyfix_Client_UI |
    | **Shared** | `/api/shared/*` | Any of the three Bearer types | All authed |
    | **Auth** | `/api/auth/*` | Public | CRM login flow |
    | **Integration v1** | `/api/integration/v1/*` | HTTP Basic | External clients (Decathlon etc.) — legacy contract |

    ### 🔑 Quick Login (recommended)
    Click the **Quick Login** button in the top-right of this page. It walks you
    through the three-step OTP flow and auto-fills the Authorize dialog for the
    correct tier — no manual copy-paste of tokens.

    Behind the scenes:

    1. `POST /auth/login-otp` (or `/mobile/auth/login-otp`, `/client/auth/login-otp`) with `{ identifier }` — issues a 4-digit OTP, TTL 5 minutes, delivered by SMS + Email. In dev (`NOTIFICATIONS_DISABLE=true`) it's logged at `warn` level with `"DEV OTP issued"`.
    2. `POST /auth/verify-otp` with `{ identifier, otp }` — verifies and consumes the OTP (one-shot), then returns `{ token, user }`.
    3. The button calls `ui.preauthorizeApiKey('bearerAdmin' | 'bearerTech' | 'bearerClient', token)` so every subsequent **Try it out** sends `Authorization: Bearer <token>` automatically.

    Token = HS256 JWT signed with `JWT_SECRET`. Claims: `sub` (user_id as string), `email`, `role`, `name`, `iat`, `exp`. Default TTL `30d` (env `JWT_EXPIRY`). Also delivered as an httpOnly `token` cookie alongside the JSON body — Swagger UI uses the body value.

    Manual flow (curl) for scripting:
    ```bash
    curl -X POST $BASE/auth/login-otp -H 'Content-Type: application/json' \
         -d '{"identifier":"you@channelplay.in"}'
    # → read OTP from email/SMS (or server logs in dev)
    curl -X POST $BASE/auth/verify-otp -H 'Content-Type: application/json' \
         -d '{"identifier":"you@channelplay.in","otp":1234}'
    # → { "success": true, "data": { "token": "eyJ…", "user": { … } } }
    ```

    ### 🔐 How the JWT Auth Token Is Generated

    The OTP flow above mints a **signed JSON Web Token (JWT)**. Here's the full pipeline:

    **Step 1 — OTP request.** `POST /auth/login-otp` writes a 4-digit code into `otp_details` with
    `valid_up_to = now + 5min` and dispatches it via SMS + Email (suppressed in dev when
    `NOTIFICATIONS_DISABLE=true` — codes are logged at `warn` level: `"DEV OTP issued"`).

    **Step 2 — OTP verify.** `POST /auth/verify-otp` looks up the matching row, checks
    `is_expired = 0` and `now < valid_up_to`, then **one-shot consumes** the OTP
    (`UPDATE otp_details SET is_expired = 1`) so the same code can never be replayed.
    On match it calls `signUserToken(user)` from `utils/jwt.js`.

    **Step 3 — JWT signing.** Each tier signs a slightly DIFFERENT claim set
    because each tier authenticates a different user-table row. Same HS256
    algorithm, same `JWT_SECRET`, same default `30d` TTL across all three.
    Click a tab below to see that tier's signing details:

    EF::JWT_TABS_MOUNT_POINT::

    **Anatomy of the token** (`header.payload.signature`, all base64url-encoded):

    | Part | Contents | Example (decoded — CRM token) |
    |---|---|---|
    | Header | `{ alg: "HS256", typ: "JWT" }` | algorithm = HMAC-SHA256 |
    | Payload | Tier-specific claims + auto `iat`/`exp` | `{ sub: "1234", email: "x@y", role: 2, name: "Priya", iat: …, exp: … }` |
    | Signature | `HMACSHA256(base64url(header) + "." + base64url(payload), JWT_SECRET)` | 256-bit MAC — prevents tampering |

    **Quick reference — what each tier's JWT looks like:**

    EF::JWT_COMPARISON_MOUNT_POINT::

    All three tiers also carry `iat` (issued-at) and `exp` (expiry) — added
    automatically by `jsonwebtoken`. The `sub` prefix is how the auth
    middleware knows which user table (`tbl_user` / `tbl_easyfixer` /
    `tbl_client_contacts`) to look up without a separate DB call.

    **Common question — "If I log in with mobile on CRM, does the JWT have email or mobile?"**
    For CRM, the JWT always carries `email` (resolved from the `tbl_user` row, regardless of
    whether `identifier` was the email or the 10-digit mobile). It does NOT carry `mobile` as
    a claim. Whatever you typed at login is just a lookup key — the JWT writes the canonical
    `official_email` back. For Technician tokens, the JWT has `mobile` (no email). For Client
    SPOC tokens, the JWT has `email` (no mobile). Different tiers, different shapes.

    **Delivery — server sends the token TWO ways simultaneously:**

    1. **JSON body** → `data.token`. This is what Swagger UI's **🔑 Quick Login** button reads.
    2. **httpOnly cookie** named `token` → set with `sameSite: 'lax'`, `secure` in production, `maxAge: 30 days`. Frontends on the same origin send it automatically; Swagger UI ignores it.

    **Verification on every authed request** (`middleware/auth.js`):

    ```js
    const decoded = jwt.verify(token, process.env.JWT_SECRET);
    req.user = {
      user_id: decoded.sub,
      email:   decoded.email,
      role:    decoded.role,
      name:    decoded.name,
    };
    ```

    Any modification to header/payload (e.g. attempting to bump `role` from 2 → 7) breaks the
    signature → `verify()` throws → `401`. Because the secret is **never** sent to the client,
    tokens cannot be forged without leaking `JWT_SECRET`.

    **Inspect the active token:** click **📋 Token** (top-right) — it decodes the payload of
    every currently-active scheme, shows the claims, the expiry countdown, and lets you copy
    the raw JWT to clipboard.

    **Security caveats worth knowing:**

    - `JWT_SECRET` is **not** `"esyfixsecret"` (the legacy CRM secret) — tokens are not interoperable across the coexistence window.
    - 30-day TTL is generous. Rotating `JWT_SECRET` is the only way to revoke before expiry — there's no per-user revocation list today.
    - The payload is base64-encoded, **not** encrypted. Don't put sensitive data in claims — anyone with the token can read `email` / `role` / `name`.
    - Technician (`bearerTech`) and Client SPOC (`bearerClient`) tokens are issued by parallel endpoints (`/mobile/auth/verify-otp` and `/client/auth/verify-otp`) — same algorithm, same secret, same expiry, but the verification middleware looks up `tbl_easyfixer` / `tbl_client_contacts` instead of `tbl_user`.

    ### Auto-generated
    Endpoint paths in this document are auto-derived from the live Express
    + Joi setup at server boot. Adding a new route + Joi validator is
    sufficient for it to appear here on the next request — no manual
    spec edit needed.

    ### Response envelopes
    All routes under `/admin`, `/mobile`, `/client`, `/shared`, `/auth` use the **modern** envelope:
    `{ success: true, data: <...>, message?: <string> }` or
    `{ success: false, error: <string>, details?: <any> }`.

    `/integration/v1/*` uses the **legacy** envelope:
    `{ status: "200", message, data }`. Do not mix.

    ### Dates
    All datetimes are IST (server-local, `Asia/Kolkata`). Format: ISO-8601
    or `YYYY-MM-DDTHH:mm:ss`. Legacy integration routes use `DD-MM-YYYY HH:mm`.
  version: '0.3.0'
  contact:
    name: EasyFix Backend Maintainers
    email: ithelpdesk@easyfix.in

servers:
  - url: http://localhost:5100/api
    description: Local development
  - url: https://qa.backend.easyfix.in/api
    description: Staging
  # backend.easyfix.in, NOT core.easyfix.in. core is the legacy Dropwizard host;
  # Nginx rewrites core.easyfix.in/v1/* onto this app's /api/integration/v1/* for
  # external clients, but nothing else of this API is served there — so a
  # core.easyfix.in/api base 404s every "Try it out" on the Production server.
  - url: https://backend.easyfix.in/api
    description: Production

components:
  securitySchemes:
    bearerAdmin:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **CRM user Bearer token.**

        - Issued by: `POST /auth/verify-otp` (after `POST /auth/login-otp`)
        - Signing: HS256, secret = env `JWT_SECRET` (NOT interoperable with legacy `"esyfixsecret"`)
        - TTL: env `JWT_EXPIRY` (default `30d`)
        - Claims: `sub` (user_id as string), `email`, `role` (numeric role_id), `name`, `iat`, `exp`
        - Verification: `middleware/auth.js` → `utils/jwt.js::verifyToken()` stamps `req.user`
        - Use for: all `/admin/*` and most `/shared/*` requests
        - Quick fill: use the **Quick Login** button (top-right) — picks `bearerAdmin` automatically when role_id ∈ {2, 3, 5, 7, 11, 12, 13, 15, 17, 18}
    bearerTech:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Technician Bearer token.**

        - Issued by: `POST /mobile/auth/verify-otp` (after `POST /mobile/auth/login-otp`)
        - JWT carries `efr_id` from `tbl_easyfixer` (technicians do not live in `tbl_user`)
        - Same HS256 / 30-day defaults as bearerAdmin
        - Use for: all `/mobile/*` requests
        - Quick fill: use **Quick Login** → tier `2`
    bearerClient:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Client SPOC Bearer token.**

        - Issued by: `POST /client/auth/verify-otp` (after `POST /client/auth/login-otp`)
        - JWT carries `contact_id` + `client_id` from `tbl_client_contacts`
        - Same HS256 / 30-day defaults as bearerAdmin
        - Use for: all `/client/*` requests
        - Quick fill: use **Quick Login** → tier `3`
    basicIntegration:
      type: http
      scheme: basic
      description: |
        **HTTP Basic Auth — `/integration/v1/*` only.**

        - Credentials resolve from **`tbl_client_user` first**, falling back to `tbl_client_website` (`status = 1`).
          `tbl_client_user` is the store BOTH legacy services authenticated against, so it wins any
          disagreement while legacy still serves traffic. Neither is `tbl_user` — that is CRM staff,
          and no CRM login works here.
        - A `tbl_client_website`-only credential cannot carry a role, so `GET /v1/services` returns the
          documented default shape for it. Only logins present in `tbl_client_user` get the role-driven shape.
        - Response envelope is the legacy `{status: "200", message, data}` shape — never mix with modern endpoints
        - Quick Login does NOT cover this scheme — open the Authorize dialog and enter username/password manually

  schemas:
    ModernOk:
      type: object
      required: [success, data]
      properties:
        success: { type: boolean, enum: [true] }
        data:    { description: Payload — shape per endpoint }
        message: { type: string, nullable: true }

    ModernError:
      type: object
      required: [success, error]
      properties:
        success: { type: boolean, enum: [false] }
        error:   { type: string, example: 'Validation failed' }
        details:
          type: array
          items:
            type: object
            properties:
              field:   { type: string, example: 'customer_mob_no' }
              message: { type: string, example: 'must be exactly 10 digits' }

    LegacyOk:
      description: Legacy response envelope — `/integration/v1/*` only.
      type: object
      properties:
        status:  { type: string, example: '200' }
        message: { type: string, example: 'OK' }
        data:    { description: Payload — legacy shape }

    Job:
      type: object
      description: List-row projection (~24 cols, joined from 5 tables).
      properties:
        job_id:               { type: integer, example: 482446 }
        job_status:           { type: integer, description: 'See Job Status codes', example: 1 }
        job_type:             { type: string, example: 'Installation' }
        customer_name:        { type: string, example: 'Harshit Sharma' }
        customer_mob_no:      { type: string, description: 'Masked on /admin/*; full on /mobile/*', example: '9310••••••' }
        client_name:          { type: string, example: 'For Testing' }
        city_name:            { type: string, example: 'New Delhi' }
        easyfixer_name:       { type: string, nullable: true, example: 'Ravi Kumar' }
        fk_easyfixter_id:     { type: integer, nullable: true, description: 'NB typo preserved — easyFIXTER not easyfixer' }
        requested_date_time:  { type: string, format: date-time, example: '2026-05-25T14:30:00' }
        scheduled_date_time:  { type: string, format: date-time, nullable: true }
        created_date_time:    { type: string, format: date-time }

    JobDetail:
      allOf:
        - $ref: '#/components/schemas/Job'
        - type: object
          properties:
            address:               { type: string, example: '12, Connaught Place' }
            pin_code:              { type: string, example: '110001' }
            gps_location:          { type: string, nullable: true, example: '28.6315,77.2167' }
            helper_req:            { type: boolean }
            job_desc:              { type: string }
            efr_special_notes:     { type: string, nullable: true }
            remarks:               { type: string, nullable: true }
            original_appointment_date_time: { type: string, format: date-time, nullable: true }
            checkin_date_time:     { type: string, format: date-time, nullable: true }
            checkout_date_time:    { type: string, format: date-time, nullable: true }
            services:
              type: array
              items:
                type: object
                properties:
                  job_service_id:    { type: integer }
                  service_type_id:   { type: integer }
                  service_type_name: { type: string }
                  amount:            { type: number, format: float }
            images:
              type: array
              items: { type: string, description: 'Public URL or presigned S3 URL' }

    Notice:
      type: object
      properties:
        notice_id:        { type: integer, example: 42 }
        title:            { type: string, example: 'Festive bonus is live' }
        body:             { type: string }
        category_id:      { type: integer, example: 1 }
        category_name:    { type: string, example: 'Incentive' }
        category_color:   { type: string, example: '#16a34a' }
        target_surfaces:  { type: string, example: 'crm,technician', description: 'CSV subset of {crm,client,technician}' }
        audience_scope:   { type: string, enum: [all, city, specific], default: all }
        action_url:       { type: string, nullable: true }
        image_keys:       { type: array, items: { type: string }, description: 'Raw S3 keys (round-trip on edit)' }
        images:           { type: array, items: { type: string }, description: 'Presigned URLs (5-min TTL) for direct rendering' }
        is_pinned:        { type: boolean }
        status:           { type: string, enum: [draft, scheduled, published, archived] }
        effective_status: { type: string, enum: [draft, scheduled, published, archived, expired] }
        publish_at:       { type: string, format: date-time, nullable: true }
        expire_at:        { type: string, format: date-time, nullable: true }
        is_read:          { type: boolean, description: 'Per-caller; only on active-feed responses' }

    NoticeCategory:
      type: object
      properties:
        category_id:         { type: integer }
        name:                { type: string, example: 'Incentive' }
        color:               { type: string, example: '#16a34a' }
        applies_to_surfaces: { type: string, example: 'crm,client,technician' }
        sort_order:          { type: integer }
        is_active:           { type: boolean }

    Holiday:
      type: object
      properties:
        date:         { type: string, format: date, example: '2026-05-27' }
        name:         { type: string, example: 'Eid-ul-Zuha (Bakrid)' }
        holiday_type: { type: string, enum: [national, regional, restricted] }
        description:  { type: string, nullable: true }

tags:
  - name: Auth
    description: OTP-based login flows (CRM, Technician, Client). Public endpoints; issue tier-appropriate Bearer JWTs.
  - name: Admin
    description: CRM staff endpoints (`/api/admin/*`). Bearer JWT from CRM auth flow.
  - name: Mobile
    description: Technician App endpoints (`/api/mobile/*`). Bearer JWT from `/mobile/auth/verify-otp`.
  - name: Client
    description: Client Dashboard SPOC endpoints (`/api/client/*`). Bearer JWT from `/client/auth/verify-otp`.
  - name: Shared
    description: Lookups + file upload available to any authed tier.
  - name: Integration
    description: External clients (Decathlon, Powermax, etc.). HTTP Basic Auth + legacy response shape — do not consume from a frontend.

# ─── Job-status code reference (referenced by every Job-* schema) ───
# | Code | Name                          | When stamped
# |------|-------------------------------|---------------------------------------
# |  0   | BOOKED                        | default on create
# |  1   | SCHEDULED                     | auto on first assign
# |  2   | IN_PROGRESS                   | tech checked in
# |  3   | COMPLETED                     | normal completion
# |  5   | COMPLETED_ALT                 | legacy alternative completion
# |  6   | CANCELLED                     | stamps cancel_*
# |  7   | ENQUIRY                       | info-only request
# |  9   | CALL_LATER                    | deferred / unconfirmed
# | 10   | REVISIT                       | closed-from-app / needs return
# | 15   | ESTIMATE_PENDING_APPROVAL
# | 20   | IN_PROGRESS_ALT
# | 21   | ON_HOLD                       | "Orders in Followup"
