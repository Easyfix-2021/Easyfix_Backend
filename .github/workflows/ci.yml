# EasyFix_Backend — PR gate: syntax-check every file + run the characterization
# test suite, BEFORE a change merges into a deploy branch. The QA/Production PUSH
# path is gated separately by deploy.yml's `precheck` job (which runs the same
# `npm test`), so this workflow covers the pull-request path without duplicating
# the push path.
#
# Tests are fake-pool based (no DB, no network, deterministic), so this needs
# nothing but Node — it runs in ~1 minute on a github-hosted runner.

name: CI (syntax + tests)

on:
  pull_request:
    branches: [QA, Production]
  workflow_dispatch:

# The suite runs in UTC, matching the container. This is DECLARED rather than
# inherited: a github-hosted runner happens to be UTC today, and the whole point
# of pinning it is that the tests must not depend on where they run. Mirrors the
# TZ=UTC prefix on the npm scripts, so a developer's local run and this one
# answer the same question — a date bug that only shows in one zone shipped to
# production once because they did not.
env:
  TZ: UTC

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Syntax check & unit tests
    runs-on: ubuntu-latest
    # RAISED 8 -> 15 to match deploy.yml's precheck. Same job shape, same
    # `npm ci`, same exposure to the 6m+ installs seen on 2026-09-04 — this one
    # simply had not been unlucky yet. Leaving it at 8 would move the identical
    # failure onto PRs instead of deploys.
    timeout-minutes: 15
    steps:
      # FULL history, not the default depth-1. The RETIRED half of the
      # message-literal audit (scripts/audit-message-literals.mjs) asks
      # `git log -L` what a constant USED to hold. In a depth-1 clone the only
      # commit is HEAD, so every constant's history is exactly its current
      # value, `stale` is always empty, and the check cannot fire — it reports
      # a clean 0 while being structurally incapable of finding anything.
      # Verified against a real --depth 1 clone of THIS repo:
      # CONVERSATION_TEMPLATE_NAME's retired 'confirm_order_flow' is visible in
      # full history and invisible at depth 1, so the audit reports a clean 0
      # there while being unable to see anything. Five constants currently carry
      # a retired value (field-crypto VERSION and MAX_CIPHERTEXT_CHARS,
      # EXPORT_ROW_CAP, PROFILE_TEMPLATE_NAME, CONVERSATION_TEMPLATE_NAME), so
      # the RETIRED half has real work here — this is not a precaution.
      #
      # The example previously named here was EMP_CODE_PREFIX's retired 'EF'.
      # That is true of the CRM, where 9c9b22b shipped 'EF' and e3b4526 corrected
      # it, but NOT of this repo: 140c1af introduced the constant already holding
      # 'E'. The conclusion was right and the evidence was borrowed — which is
      # the same defect this audit exists to catch, one directory up.
      #
      # 571 commits / 8 MiB, so this costs nothing.
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: 'npm' }
      # Same flags as deploy.yml's precheck, for the same measured reason: a
      # warm cache was restored and then ignored while npm blocked on registry
      # revalidation for 363s. See that file's precheck comment.
      - run: npm ci --prefer-offline --no-audit --fund=false
      - name: Build check (syntax-check all files)
        run: npm run build
      - name: Lint (no-undef — the copy-paste-across-handlers guard)
        run: npm run lint
      # UNGUARDED-AWAIT GATE. In Express 4 a rejection from an `await` that is not
      # inside its handler's try reaches no error middleware: the request hangs,
      # and before server.js grew an `unhandledRejection` listener it EXITED THE
      # PROCESS — that is what restarted production on 2026-09-08 from a single
      # pool error in requireAuth.
      #
      # --self-test RUNS FIRST, AND THAT ORDER IS THE POINT. The census exits 0
      # when it finds nothing, and a scanner that has stopped working finds
      # nothing too. --self-test drives 17 hand-written fixtures with known
      # verdicts, so it fails when the tool breaks rather than when the tree is
      # clean. Gating on --gate alone would be a green light attached to nothing.
      #
      # --gate then checks its own CAPABILITY before its result: 0 parse errors
      # (an unparsed file was not scanned) and a floor on the number of async
      # handlers found (939 today) so a collapse in detection fails loudly
      # instead of reporting a clean tree. See the header of the script.
      - name: Unguarded-await scanner self-test (the tool must be able to fail)
        run: node scripts/scan-unguarded-await.js --self-test
      - name: Unguarded-await gate (Express 4 async-handler rejections)
        run: node scripts/scan-unguarded-await.js --gate
      # SCOPED-SKILL SCOPE GATE. A skill under `.claude/skills/` is preferred OVER
      # the general skill of the same name whenever work happens in this repo —
      # authority granted by the file's PATH, which is set by whoever copied it.
      # On 2026-09-08 all five here turned out to be copies from a sibling
      # project: wrong tables, wrong paths, and a security checklist asserting an
      # auth model this product explicitly does not use. They had been preferred
      # the whole time. Copying is the cheapest way to make a scoped skill, so
      # the failure is produced by ordinary work and a prose warning will not hold.
      #
      # --self-test FIRST, same reason as the scanner above: the check exits 0
      # when it finds nothing, and a checker that has stopped working finds
      # nothing too. The fixtures include every false positive this tool has had
      # (bare filenames, require specifiers, package names, git refs, timezones),
      # so relaxing the rule to make a file pass turns them red.
      # MIGRATION-COLUMN CHECKER. --self-test first, for the third time on this
      # page and the same reason: the census exits 0 when it finds no INSERT,
      # which is what a scanner that can no longer parse SQL also reports.
      #
      # Its fixtures encode the false positive it actually had: on 2026-09-10 it
      # read a `--` comment describing a legacy INSERT as a real one, so a
      # migration could not document a write without tripping the check that
      # looks for writes. They also pin the regression that fix introduced —
      # blanking backtick identifiers made `INSERT INTO `t`` stop being found
      # at all — which the fixtures caught on their first run.
      - name: Migration-column checker self-test (the tool must be able to fail)
        run: npm run check:migrations:self-test
      - name: Skill-scope checker self-test (the tool must be able to fail)
        run: npm run check:skills:self-test
      - name: Scoped skills describe THIS repository
        run: npm run check:skills
      # CROSS-REPO PARITY. tests/wire-contract.test.js and
      # tests/job-search-parity.test.js read two files out of the CRM repo
      # (shared/wire-contract.json, src/lib/job-tabs.ts). Until this step existed
      # the CRM was never checked out here, so those checks SKIPPED in every CI
      # run that has ever gated a deploy — committed, green, enforcing nothing.
      # They now assert.fail() under CI instead of skipping, so this step is
      # load-bearing: if the clone breaks, the tests go red rather than quiet.
      #
      # --depth 1: both tests are plain file reads — no `git log`, no history
      # (verified: the only test in this repo that shells out to git is
      # message-literals.test.js, and it reads THIS repo via THIS repo's
      # scripts/audit-message-literals.mjs). Contrast the checkout above, which
      # is fetch-depth 0 precisely because that audit needs this repo's log.
      #
      # Easyfix_CRM_UI is public, exactly like this repo, so no token and no
      # secret. Verified tokenless: `git ls-remote` on the URL below resolves.
      #
      # "$RUNNER_TEMP", NOT the workspace. `npm run lint` is `eslint .` from the
      # repo root: a clone inside the workspace would be linted with this repo's
      # config, and the walk would hand eslint ~15k CRM files that are not ours.
      # RUNNER_TEMP is outside the workspace, so `eslint .` never sees it.
      # ($RUNNER_TEMP is the shell env var inside `run:`; ${{ runner.temp }} is
      # the expression form needed in an `env:` block. Same path.)
      - name: Fetch Easyfix_CRM_UI for cross-repo parity
        run: git clone --quiet --depth 1 https://github.com/Easyfix-2021/Easyfix_CRM_UI.git "$RUNNER_TEMP/easyfix-crm-ui"
      - name: Unit tests (characterization — no DB)
        env:
          EASYFIX_CRM_UI_DIR: ${{ runner.temp }}/easyfix-crm-ui
        run: npm test
      # STRICT (no --fix) counterpart to the pre-commit hook. The hook refreshes
      # the offline-reliability snapshot automatically so routine commits are not
      # blocked; this is the backstop that still catches a --no-verify commit, or
      # one made from a clone that never ran `offline-reliability-sync
      # install-hooks`. Read-only: no backend, DB, or network.
      - name: Offline reliability contract in sync
        run: npm run check:offline
