# EasyFix QA stack — runs on the EC2 at /opt/easyfix/docker-compose.yml.
#
# This file is the single source of truth for what's running. Both
# services pull pre-built images from AWS ECR; the GitHub Actions
# workflows build + push, then SSM-tell this box to `compose pull`
# the new tag and recreate the container.
#
# Image tags come from /opt/easyfix/.env (auto-loaded by docker compose):
#   BACKEND_IMAGE=902810393464.dkr.ecr.ap-south-1.amazonaws.com/easyfix/backend:qa-<sha>
#   CRM_UI_IMAGE=902810393464.dkr.ecr.ap-south-1.amazonaws.com/easyfix/crm-ui:qa-<sha>
#   CLIENT_UI_IMAGE=902810393464.dkr.ecr.ap-south-1.amazonaws.com/easyfix/client-ui:qa-<sha>
#
# The workflows update the relevant variable on each deploy via
# `sed -i` over /opt/easyfix/.env — each service's deploy touches only
# its own *_IMAGE line; the others are untouched.
#
# ECR pull authenticates via the EC2 instance profile's
# AmazonEC2ContainerRegistryReadOnly policy + the
# amazon-ecr-credential-helper installed on the box. No `docker login`
# is ever required.

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: easyfix-backend
    restart: unless-stopped
    # OOM priority — DEPRIORITIZE the backend under GLOBAL memory pressure so STT
    # (oom_score_adj 1000) is killed first. We use -500, NOT the -1000 floor: at
    # -1000 the backend is effectively unkillable, so a backend-originated leak
    # would force the kernel to kill sshd / ssm-agent / the UIs first and leave the
    # box unrecoverable (no way in to deploy a fix). -500 keeps the backend the last
    # CONTAINER the kernel picks while still allowing reclaim before a total stall.
    # NOTE: the airtight guarantee that STT can't touch the backend is STT's own
    # mem_limit (a capped container's OOM is cgroup-scoped); this is the global-
    # pressure backstop only.
    oom_score_adj: -500
    env_file:
      # Real secrets live HERE on the host filesystem (chmod 600).
      # Managed via deploy/bootstrap-env.sh — never in any image, never
      # in git, never in GitHub Secrets.
      - /opt/easyfix/backend.env
    environment:
      # AI Teleprompter STT runs as its OWN container (`stt` service below) —
      # the backend image is Node-only. Point the relay at it over the compose
      # network, and keep the IN-PROCESS autostart OFF so we never spawn a
      # second copy inside the backend. (These override backend.env.)
      STT_SERVICE_URL: "ws://stt:8300/stt"
      STT_AUTOSTART: "false"
      # Shared key for the STT OOM-alert webhook (also given to stt-oom-watch).
      # MUST be set in /opt/easyfix/.env (NOT backend.env — this environment: block
      # overrides env_file, so a backend.env value would be clobbered to ''). Unset
      # ⇒ OOM alerting is off (no-op).
      STT_OOM_WEBHOOK_KEY: ${STT_OOM_WEBHOOK_KEY:-}
      # Human label for the alert email (QA vs Production).
      DEPLOY_ENV: "qa"
    # No depends_on: stt — the backend connects to STT lazily per-call and the
    # mandatory-STT gate returns 409 when it's down, so the backend must NOT be
    # coupled to the stt service. Coupling here would also hard-fail a first-boot
    # backend deploy on a box where STT_IMAGE isn't in .env yet (compose would try
    # to create stt with an empty image and abort the whole `up`).
    ports:
      # host:5100 → container:5100. Tighten to 127.0.0.1:5100 if/when
      # nginx fronts it.
      - "5100:5100"
    networks:
      - easyfix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5100/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  crm-ui:
    image: ${CRM_UI_IMAGE}
    container_name: easyfix-crm-ui
    restart: unless-stopped
    # NEXT_PUBLIC_API_URL is BAKED INTO the static JS chunks at build
    # time (in CI, via --build-arg). The container itself doesn't need
    # any runtime env vars beyond NODE_ENV / PORT, which are set by the
    # Dockerfile. Don't add an env_file here unless server-side runtime
    # secrets become a thing (they currently don't).
    environment:
      NODE_ENV: production
      PORT: "5180"
    ports:
      - "5180:5180"
    networks:
      - easyfix-net
    depends_on:
      # Soft dep — compose starts backend FIRST so SSR fetches at boot
      # don't 502.
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5180/login", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  client-ui:
    image: ${CLIENT_UI_IMAGE}
    container_name: easyfix-client-ui
    restart: unless-stopped
    # Same baking model as crm-ui — NEXT_PUBLIC_API_URL is compiled into
    # the bundle at build time. No env_file needed. The Client_UI portal
    # serves SPOC users at /api/client/* on the backend.
    environment:
      NODE_ENV: production
      PORT: "5181"
    ports:
      - "5181:5181"
    networks:
      - easyfix-net
    depends_on:
      # Soft dep — same reasoning as crm-ui (SSR fetches at boot).
      backend:
        condition: service_started
    healthcheck:
      # Dedicated /healthcheck route handler (src/app/healthcheck/route.ts
      # in Easyfix_client_UI). Cheaper than rendering `/`, and gives an
      # explicit JSON contract: { status: "ok", service: "client-ui", ts }.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5181/healthcheck", "-O", "/dev/null"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────
  # Dozzle — web UI for live Docker logs (https://dozzle.dev).
  # Visit http://<ec2-private-ip>:8888 from the VPN to see live,
  # searchable logs for backend + crm-ui in your browser. Multi-
  # container tabs, regex filter, real-time follow.
  #
  # SECURITY POSTURE — network-only:
  # No app-level auth. The EC2 is in a private subnet; reaching :8888
  # at all requires being on the AWS Client VPN, which is the trust
  # boundary. The Docker socket is mounted READ-ONLY (`:ro`) so even
  # if Dozzle had a vulnerability, it can't mutate Docker state — only
  # read container metadata + logs.
  #
  # If you ever expose this EC2 to the public internet, add
  # DOZZLE_AUTH_PROVIDER=simple + a users.yml volume mount before doing
  # so. Search "Dozzle authentication" in dozzle.dev for the recipe.
  dozzle:
    image: amir20/dozzle:latest
    container_name: easyfix-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: "EasyFix QA"
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # ─────────────────────────────────────────────────────────────────
  # STT sidecar — self-hosted OSS speech-to-text for the AI Teleprompter.
  # Its OWN container (Python + faster-whisper; the backend image is Node-only).
  # Built from stt-service/Dockerfile and deployed INDEPENDENTLY by
  # .github/workflows/deploy-stt.yml (triggers on stt-service/** pushes only, so
  # code-only backend changes don't rebuild this heavy image and vice-versa).
  # The backend reaches it at ws://stt:8300/stt on the compose network; the port
  # is deliberately NOT published to the host (internal only). The image is
  # SELF-CONTAINED — deps AND the model are baked at build time (see
  # stt-service/Dockerfile), so no env/volume/healthcheck is needed here and there
  # is no runtime model download.
  # ⚠ Needs ~0.5–1 GB RAM resident for the 'small' model.
  #
  # mem_limit is a SAFETY FENCE so STT can never balloon and OOM-kill the backend
  # or the UI containers on this shared QA box. STT_MEM_LIMIT is computed at deploy
  # time as a % of THIS box's RAM (clamped) by deploy-stt.yml and written to
  # /opt/easyfix/.env, so it auto-adjusts if the instance is resized. The :-1g
  # fallback covers a first-boot before deploy-stt has written the value (e.g. the
  # backend deploy pulling stt up via depends_on) — 1g fits the 'small' model.
  stt:
    image: ${STT_IMAGE}
    container_name: easyfix-stt
    restart: unless-stopped
    mem_limit: ${STT_MEM_LIMIT:-1g}
    # First victim under GLOBAL memory pressure (mirror of the backend's -1000).
    # Combined with mem_limit above: STT can OOM (its own cgroup) but the backend
    # never does.
    oom_score_adj: 1000
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # ─────────────────────────────────────────────────────────────────
  # stt-oom-watch — tiny watcher that emails ops when the STT container is
  # OOM-killed. Same trust model as Dozzle: Docker socket mounted READ-ONLY, VPN-
  # gated network. It watches `easyfix-stt` for an `oom` event (or a `die` with
  # State.OOMKilled=true) and POSTs to the backend's internal webhook, which loads
  # recipients from easyfix_properties('teleprompter.stt.alert.emails') and sends
  # the mail. No-op unless STT_OOM_WEBHOOK_KEY (+ recipients) are configured, so
  # it's inert by default. The image is `docker:cli` (has the docker client +
  # BusyBox wget); nothing is installed at runtime.
  stt-oom-watch:
    image: docker:27-cli
    container_name: easyfix-stt-oom-watch
    restart: unless-stopped
    depends_on:
      stt:
        condition: service_started
    environment:
      WATCH_CONTAINER: "easyfix-stt"
      OOM_WEBHOOK_URL: "http://backend:5100/api/webhook/stt-oom"
      OOM_WEBHOOK_KEY: ${STT_OOM_WEBHOOK_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation → the shell sees a single $ at runtime.
    command:
      - |
        echo "stt-oom-watch: watching $$WATCH_CONTAINER for OOM-kills"
        docker events --filter "container=$$WATCH_CONTAINER" --filter "event=oom" --filter "event=die" --format '{{.Action}} {{.Actor.Attributes.exitCode}}' \
        | while read ACTION EXITCODE; do
            if [ "$$ACTION" = "oom" ]; then OOM=true; else OOM=$$(docker inspect -f '{{.State.OOMKilled}}' "$$WATCH_CONTAINER" 2>/dev/null || echo false); fi
            echo "stt-oom-watch: event=$$ACTION exit=$$EXITCODE oomKilled=$$OOM"
            [ "$$OOM" = "true" ] || continue
            [ -n "$$OOM_WEBHOOK_KEY" ] || { echo "stt-oom-watch: OOM_WEBHOOK_KEY unset — skipping alert"; continue; }
            wget -q -O - \
              --header "content-type: application/json" \
              --header "x-webhook-key: $$OOM_WEBHOOK_KEY" \
              --post-data "{\"container\":\"$$WATCH_CONTAINER\",\"exitCode\":\"$$EXITCODE\",\"oomKilled\":true}" \
              "$$OOM_WEBHOOK_URL" >/dev/null 2>&1 \
              && echo "stt-oom-watch: OOM alert POSTed" \
              || echo "stt-oom-watch: OOM alert POST failed"
          done
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  easyfix-net:
    driver: bridge
