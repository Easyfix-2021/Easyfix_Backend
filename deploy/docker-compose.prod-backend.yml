# EasyFix PROD — Backend-only stack
#
# Runs on the prod BE EC2 at /opt/easyfix/docker-compose.yml. Topology:
#
#   QA (one shared EC2)      — full combined stack (backend + crm-ui +
#                              client-ui + dozzle) per deploy/docker-compose.yml
#   PROD (two EC2s)
#     • PROD_BACKEND_INSTANCE_ID  ← THIS file: backend + dozzle ONLY
#     • PROD_FRONTEND_INSTANCE_ID ← UI repos' compose (crm-ui + client-ui + dozzle)
#
# Why split: the prod BE EC2 doesn't run the UI containers, so listing
# them here would (a) waste compose-pull cycles, (b) churn the
# /opt/easyfix/.env file every UI deploy via image-tag writes that
# nothing on this host consumes, and (c) confuse anyone reading
# `docker ps` ("why are UI services declared but not running?").
#
# Image tag comes from /opt/easyfix/.env:
#   BACKEND_IMAGE=902810393464.dkr.ecr.ap-south-1.amazonaws.com/easyfix/backend:production-<sha>
#
# Updated by .github/workflows/deploy.yml on every prod deploy (sed-in-place).
#
# ECR pull authenticates via the EC2 instance profile's
# AmazonEC2ContainerRegistryReadOnly policy + the
# amazon-ecr-credential-helper installed on the box. No `docker login`
# is ever required — IF the helper + IAM policy are present. If you see
# `pull access denied… no basic auth credentials`, the helper is NOT
# installed on this host; see ECR_AUTH_BOOTSTRAP.md.

services:
  backend:
    image: ${BACKEND_IMAGE}
    container_name: easyfix-backend
    restart: unless-stopped
    # OOM priority — PROTECT the backend. If the box ever hits a GLOBAL
    # out-of-memory, -1000 makes the backend the last thing the kernel will kill,
    # so STT (oom_score_adj 1000) dies first. The airtight guarantee is already
    # STT's own mem_limit (cgroup-scoped OOM); this is the global-pressure backstop.
    oom_score_adj: -1000
    env_file:
      # Real secrets live HERE on the host filesystem (chmod 600).
      # Managed via deploy/bootstrap-env.sh — never in any image, never
      # in git, never in GitHub Secrets.
      - /opt/easyfix/backend.env
    environment:
      # AI Teleprompter STT runs as its OWN container (`stt` service below).
      # Point the relay at it; keep the in-process autostart OFF (no double spawn).
      STT_SERVICE_URL: "ws://stt:8300/stt"
      STT_AUTOSTART: "false"
      # Shared key for the STT OOM-alert webhook (also given to stt-oom-watch);
      # sourced from /opt/easyfix/.env. Unset ⇒ OOM alerting is off (no-op).
      STT_OOM_WEBHOOK_KEY: ${STT_OOM_WEBHOOK_KEY:-}
      # Human label for the alert email (QA vs Production).
      DEPLOY_ENV: "production"
    depends_on:
      stt:
        condition: service_started
    ports:
      - "5100:5100"
    networks:
      - easyfix-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5100/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Dozzle — log viewer at :8888. Same trust model as QA: network-only
  # auth, Docker socket mounted read-only, VPN-gated. Kept on the BE
  # host because that's where the highest-volume logs originate.
  dozzle:
    image: amir20/dozzle:latest
    container_name: easyfix-dozzle
    restart: unless-stopped
    environment:
      DOZZLE_HOSTNAME: "EasyFix Prod-BE"
    ports:
      - "8888:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  # STT sidecar — self-hosted OSS speech-to-text for the AI Teleprompter.
  # Own container; the IMAGE is self-contained (deps + model baked at build, see
  # stt-service/Dockerfile) so no env/volume/healthcheck needed. Deployed by
  # deploy-stt.yml on stt-service/** pushes. Backend reaches it at ws://stt:8300/stt.
  # ⚠ Needs ~0.5–1 GB RAM for the 'small' model.
  #
  # mem_limit is a SAFETY FENCE so STT can never balloon and OOM-kill the backend
  # on this prod-BE box. STT_MEM_LIMIT is computed at deploy time as a % of THIS
  # box's RAM (clamped) by deploy-stt.yml and written to /opt/easyfix/.env, so it
  # auto-adjusts if the instance is resized. The :-1g fallback covers a first-boot
  # before deploy-stt has written the value — 1g fits the 'small' model.
  stt:
    image: ${STT_IMAGE}
    container_name: easyfix-stt
    restart: unless-stopped
    mem_limit: ${STT_MEM_LIMIT:-1g}
    # First victim under GLOBAL memory pressure (mirror of the backend's -1000).
    # Combined with mem_limit above: STT can OOM (its own cgroup) but the backend
    # never does.
    oom_score_adj: 1000
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # stt-oom-watch — emails ops when the STT container is OOM-killed. Docker socket
  # mounted READ-ONLY (Dozzle trust model). Watches `easyfix-stt` for `oom`/`die`
  # and POSTs the backend's internal webhook, which mails the recipients in
  # easyfix_properties('teleprompter.stt.alert.emails'). Inert unless
  # STT_OOM_WEBHOOK_KEY (+ recipients) are set. Image ships the docker client +
  # BusyBox wget; nothing installed at runtime.
  stt-oom-watch:
    image: docker:27-cli
    container_name: easyfix-stt-oom-watch
    restart: unless-stopped
    depends_on:
      stt:
        condition: service_started
    environment:
      WATCH_CONTAINER: "easyfix-stt"
      OOM_WEBHOOK_URL: "http://backend:5100/api/webhook/stt-oom"
      OOM_WEBHOOK_KEY: ${STT_OOM_WEBHOOK_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes compose interpolation → the shell sees a single $ at runtime.
    command:
      - |
        echo "stt-oom-watch: watching $$WATCH_CONTAINER for OOM-kills"
        docker events --filter "container=$$WATCH_CONTAINER" --filter "event=oom" --filter "event=die" --format '{{.Action}} {{.Actor.Attributes.exitCode}}' \
        | while read ACTION EXITCODE; do
            if [ "$$ACTION" = "oom" ]; then OOM=true; else OOM=$$(docker inspect -f '{{.State.OOMKilled}}' "$$WATCH_CONTAINER" 2>/dev/null || echo false); fi
            echo "stt-oom-watch: event=$$ACTION exit=$$EXITCODE oomKilled=$$OOM"
            [ "$$OOM" = "true" ] || continue
            [ -n "$$OOM_WEBHOOK_KEY" ] || { echo "stt-oom-watch: OOM_WEBHOOK_KEY unset — skipping alert"; continue; }
            wget -q -O - \
              --header "content-type: application/json" \
              --header "x-webhook-key: $$OOM_WEBHOOK_KEY" \
              --post-data "{\"container\":\"$$WATCH_CONTAINER\",\"exitCode\":\"$$EXITCODE\",\"oomKilled\":true}" \
              "$$OOM_WEBHOOK_URL" >/dev/null 2>&1 \
              && echo "stt-oom-watch: OOM alert POSTed" \
              || echo "stt-oom-watch: OOM alert POST failed"
          done
    networks:
      - easyfix-net
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

networks:
  easyfix-net:
    driver: bridge
